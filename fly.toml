# Fly.io config for the B2B Escrow API. Lives at the repo ROOT so the build context is the
# whole monorepo (the API imports workspace packages/*). Deploy from the repo root:
#   fly deploy --ha=false
app = "clairtus-api"
primary_region = "jnb"  # Johannesburg — closest to SA design partners

[build]
  dockerfile = "apps/b2b-api/Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  # Supabase transaction pooler (pgBouncer) requires prepared statements OFF (the default here).
  # Non-secret config only — secrets are set via `fly secrets set` (see docs/DEPLOYMENT.md).

[http_service]
  internal_port = 3000
  force_https = true
  # Always-on single instance — do NOT auto-stop (an API + webhook worker must stay live).
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  method = "GET"
  path = "/v1/health"
  interval = "15s"
  timeout = "5s"
  grace_period = "30s"  # tsx + NestJS cold start needs headroom before checks count

# 1 GB headroom for Node + the Postgres pool + Swagger (avoids any OOM under load).
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"

# Run DB migrations once per release, before the new version takes traffic.
[deploy]
  release_command = "corepack pnpm --filter @clairtus/b2b-api migrate"
