name: Deploy API

# Deploy the B2B API to Fly.io on every push to main, but only after CI is green.
# The dashboard auto-deploys via Vercel on push, so it isn't handled here.
# Requires repo secret FLY_API_TOKEN (`fly tokens create deploy -a clairtus-api`).
# When the secret is absent the deploy step is skipped, so CI stays green pre-setup.
on:
  push:
    branches: [main]

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  verify:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter "./packages/*" --filter "./apps/*" typecheck
      - run: pnpm -r --filter "./packages/*" --filter "./apps/*" test

  deploy:
    name: fly deploy
    needs: verify
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy (no-HA, single machine — matches the live topology)
        if: ${{ env.FLY_API_TOKEN != '' }}
        run: flyctl deploy --ha=false --remote-only
      - name: Skipped (no FLY_API_TOKEN secret set)
        if: ${{ env.FLY_API_TOKEN == '' }}
        run: echo "FLY_API_TOKEN not set — skipping deploy. Add it in repo Settings → Secrets."
