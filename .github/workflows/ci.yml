name: CI

# Gate every PR into main on a clean typecheck + the full test suite.
# Tests are Docker-free (pglite in-process Postgres + jsdom), so the runner needs no services.
# Pushes to main are verified by the deploy workflow (verify → deploy), so they aren't re-run here.
on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup reads the version from package.json `packageManager` (pnpm@10.16.1).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck (packages + apps)
        run: pnpm -r --filter "./packages/*" --filter "./apps/*" typecheck

      - name: Test (packages + apps)
        run: pnpm -r --filter "./packages/*" --filter "./apps/*" test
