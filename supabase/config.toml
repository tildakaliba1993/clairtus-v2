
[functions.pawapay-webhook]
enabled = true
# Called by PawaPay (external). It cannot send a Supabase JWT, so JWT verification
# must be off — the function verifies the payment payload itself.
verify_jwt = false
import_map = "./functions/pawapay-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/pawapay-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/pawapay-webhook/*.html" ]

[functions.whatsapp-webhook]
enabled = true
# Called by Meta WhatsApp servers (external). They cannot send a Supabase JWT.
# MUST be false or every inbound message is rejected at the gateway (zero logs).
# Security is enforced via META_VERIFY_TOKEN on the GET handshake.
verify_jwt = false
import_map = "./functions/whatsapp-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/whatsapp-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/whatsapp-webhook/*.html" ]

[functions.admin-console]
enabled = true
# Authenticates via its own adminSecret in the request body, not a Supabase JWT.
verify_jwt = false
import_map = "./functions/admin-console/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/admin-console/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/admin-console/*.html" ]

[functions.transaction-sweeper]
enabled = true
# Invoked by the internal cron. Setting false is strictly more permissive and
# cannot break a working cron; it guarantees the sweeper is reachable.
verify_jwt = false
import_map = "./functions/transaction-sweeper/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/transaction-sweeper/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/transaction-sweeper/*.html" ]

[functions.queue-worker]
enabled = true
# Triggered by the trigger-queue-worker database webhook, which does not attach a
# Supabase JWT. MUST be false or queued payments are never processed.
verify_jwt = false
import_map = "./functions/queue-worker/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/queue-worker/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/queue-worker/*.html" ]

[functions.admin-actions]
enabled = true
# Called by the admin panel's /api/admin/action proxy with Bearer ADMIN_SECRET
# (a custom secret, not a Supabase JWT). MUST be false or admin actions 401 at the gateway.
verify_jwt = false
import_map = "./functions/admin-actions/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/admin-actions/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/admin-actions/*.html" ]

[functions.simulate-alerts]
enabled = true
verify_jwt = false
import_map = "./functions/simulate-alerts/deno.json"
entrypoint = "./functions/simulate-alerts/index.ts"


[functions.kyc-webhook]
enabled = true
# Triggered by the notify_user_on_kyc database webhook (users table UPDATE), which
# does not attach a Supabase JWT. MUST be false or KYC notifications silently fail.
verify_jwt = false
import_map = "./functions/kyc-webhook/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/kyc-webhook/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/kyc-webhook/*.html" ]

[functions.smile-id-callback]
enabled = true
verify_jwt = false
import_map = "./functions/smile-id-callback/deno.json"
entrypoint = "./functions/smile-id-callback/index.ts"

[functions.fx-rate-updater]
enabled = true
# Invoked by the internal daily cron — false keeps it reachable regardless of how
# the scheduler attaches (it has no external caller and writes only the fx cache).
verify_jwt = false
import_map = "./functions/fx-rate-updater/deno.json"
entrypoint = "./functions/fx-rate-updater/index.ts"
